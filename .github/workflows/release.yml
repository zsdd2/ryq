name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      base_version: ${{ steps.version.outputs.base_version }}
      bump: ${{ steps.version.outputs.bump }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Calculate next version
        id: version
        run: node scripts/release/next-version.mjs

  build-windows:
    runs-on: windows-latest
    needs: version
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply release version
        run: node scripts/release/set-package-version.mjs "${{ needs.version.outputs.version }}"

      - name: Build Windows artifacts
        run: npm run dist:win:ci

      - name: Create release and upload Windows artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          BUMP: ${{ needs.version.outputs.bump }}
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File | Where-Object {
            $_.Extension -in @('.exe', '.yml', '.blockmap')
          }
          if ($files.Count -eq 0) {
            Write-Error "No Windows artifacts were generated"
            exit 1
          }

          if (-not (gh release view $env:TAG 2>$null)) {
            gh release create $env:TAG `
              --title "任意签 $env:VERSION" `
              --notes "Automatic release for 任意签 version $env:VERSION ($env:BUMP bump)." `
              --generate-notes
          }

          $paths = $files | ForEach-Object { $_.FullName }
          gh release upload $env:TAG $paths --clobber
