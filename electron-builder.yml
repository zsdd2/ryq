appId: com.renyiqian.desktop
productName: 任意签
asar: true
directories:
  output: dist
files:
  - out/**
  - package.json
  - logos/renyiqian-logo.ico
linux:
  target:
    - AppImage
    - tar.gz
win:
  icon: logos/renyiqian-logo.ico
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
artifactName: renyiqian-setup-${version}.${ext}
publish:
  - provider: github
    owner: zsdd2
    repo: ryq
    releaseType: release
